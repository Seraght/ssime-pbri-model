<script>
/* ============ PURE LOGIC MODULE (no DOM): lift this into the real app ============ */
const SSIME=(()=>{
  const LEVELS=["white","lgreen","dgreen","yellow","orange","red","black"];
  // Ping-pong 7 colours (พรหมศวร et al., 2568, citing Wanchai et al., 2566). Lower bounds inclusive (team rule).
  function bpLevel(s,d,dx){if(s>=180||d>=110)return 5;if(s>=160||d>=100)return 4;if(s>=140||d>=90)return 3;if(dx)return 2;if(s>=120||d>=80)return 1;return 0}
  function sugarLevel(g,dx){if(g>=183)return 5;if(g>=155)return 4;if(g>=126)return 3;if(dx)return 2;if(g>=100)return 1;return 0}
  // Simulated AI: fixed outputs per demo sample. Not a model.
  const SIM={face:{normal:{abnormal:false,score:0.07},droop:{abnormal:true,score:0.82}},speech:{clear:{abnormal:false,score:0.06},slurred:{abnormal:true,score:0.87}}};
  function befast(b){const flags=[];
    if(b.face&&SIM.face[b.face].abnormal)flags.push("F");
    if(b.speech&&SIM.speech[b.speech].abnormal)flags.push("S");
    ["B","E","A"].forEach(k=>{if(b[k])flags.push(k)});
    return{positive:flags.length>0,flags}}
  // Thai CV Risk Score: Ramathibodi calculator (formular.js, 2021-04-23). Only ages 35-70 without prior CVD.
  function cvRisk(x){if(x.age<35||x.age>70)return null;const S=0.964588,dm=x.dmdx?1:0,sm=x.smoke?1:0;let f;
    if(x.tc>0){f=0.08183*x.age+0.39499*x.sex+0.02084*x.sbp+0.69974*dm+0.00212*x.tc+0.41916*sm;return 1-Math.pow(S,Math.exp(f-7.04423))}
    f=0.079*x.age+0.128*x.sex+0.019350987*x.sbp+0.58454*dm+3.512566*(x.waist/x.height)+0.459*sm;return 1-Math.pow(S,Math.exp(f-7.712325))}
  // Order of use: 1 BEFAST -> 2 colour -> 3 CV risk. BEFAST positive = black, nothing else computed.
  function assess(profile,bf,visit){const B=befast(bf||{});
    if(B.positive)return{level:6,befast:B,reason:{type:"befast",flags:B.flags},cv:null,cvNote:"stroke",cvHigh:false};
    const x={...profile,...visit},b=bpLevel(x.sbp,x.dbp,x.htdx),g=sugarLevel(x.fbs,x.dmdx),cv=cvRisk(x);
    return{level:Math.max(b,g),befast:B,reason:{type:b>=g?"bp":"sugar",b,g,x},cv,cvNote:cv==null?"age":null,cvHigh:cv!=null&&cv>=0.2}}
  const RANGES={sbp:[70,260],dbp:[40,160],fbs:[40,500],age:[15,100],height:[100,220],waist:[40,200]};
  function validate(k,v){const r=RANGES[k];return Number.isFinite(v)&&v>=r[0]&&v<=r[1]}
  const MISSIONS=["salt","sweet","oil","smoke","alcohol","weight","med","walk"];
  function ruleMissions(x){const m=[];
    if(x.sbp>=120||x.dbp>=80)m.push("salt");
    if(x.fbs>=100||x.dmdx)m.push("sweet");
    if(x.smoke)m.push("smoke");
    if(x.waist/x.height>=0.5)m.push("weight");
    if(x.htdx||x.dmdx)m.push("med");
    m.push("oil","walk");
    return[...new Set(m)].slice(0,3)}
  function kapScore(a){const s=k=>((a[k+"1"]?1:0)+(a[k+"2"]?1:0))*50;return{K:s("K"),A:s("A"),P:s("P")}}
  // Base rate: precision of a test with fixed sensitivity/specificity at a given prevalence
  function precisionAt(sens,spec,prev){const tp=sens*prev,fp=(1-spec)*(1-prev);return tp/(tp+fp)}
  return{LEVELS,SIM,befast,cvRisk,assess,validate,RANGES,MISSIONS,ruleMissions,kapScore,precisionAt}
})();

/* ============ STATE + REDUCER ============ */
const DRAFT={sex:0,htdx:0,dmdx:0,smoke:0,tc:0};
function initial(pid,lang){const hist={};Object.keys(PATIENTS).forEach(k=>{hist[k]=PATIENTS[k].v.map(v=>({visit:v,bf:{},level:SSIME.assess(PATIENTS[k].p,{},v).level}))});
  pid=pid||"buaphan";
  return{lang:lang||"th",pid,tab:"home",step:PATIENTS[pid].isNew?"consent":null,bf:{},visit:{},error:"",result:null,hist,done:{},picks:{},kap:{},kapPre:{},prof:{},draft:{...DRAFT},kapOpen:false,kapAns:{},onset:null,last:"—",changed:[]}}
function lastVisit(s){const h=s.hist[s.pid];return h[h.length-1]}
function profileOf(s){return s.prof[s.pid]||PATIENTS[s.pid].p}
function reduce(s,a){const n={...s,error:"",changed:[]};const pr=profileOf(s)||{};
  switch(a.type){
  case"RESET":return{...initial(a.pid,s.lang),last:a.type,changed:["patient"]};
  case"ONBOARD":return{...n,tab:"home",step:"consent",draft:{...DRAFT},last:a.type,changed:["screen"]};
  case"CONSENT":return{...n,step:"age",last:a.type,changed:["screen"]};
  case"PVALUE":{if(!SSIME.validate(a.k,a.v))return{...n,error:a.k,last:a.type+" "+a.k+"="+a.v+" ✗",changed:["profile"]};
    const order=["age","height","waist","pyn"];return{...n,draft:{...s.draft,[a.k]:a.v},step:order[order.indexOf(a.k)+1],last:a.type+" "+a.k+"="+a.v,changed:["profile","screen"]}}
  case"PANS":return{...n,draft:{...s.draft,[a.k]:a.v},last:a.type+" "+a.k+"="+a.v,changed:["profile"]};
  case"PROFILE_DONE":return{...n,prof:{...s.prof,[s.pid]:{...s.draft}},step:"kappre",kapAns:{},last:a.type,changed:["profile","screen"]};
  case"KAPPRE_SAVE":return{...n,kapPre:{...s.kapPre,[s.pid]:SSIME.kapScore(s.kapAns)},step:null,tab:"home",last:a.type,changed:["kapPre","screen"]};
  case"KAPPRE_SKIP":return{...n,step:null,tab:"home",last:a.type,changed:["kapPre","screen"]};
  case"LANG":return{...n,lang:a.v};
  case"GO":return{...n,tab:a.v,step:null,kapOpen:false,last:a.type+" "+a.v,changed:["screen"]};
  case"START":{if(!profileOf(s))return{...n,tab:"home",step:"consent",draft:{...DRAFT},last:a.type+" → onboarding",changed:["screen"]};
    const lv=lastVisit(s);return{...n,tab:"home",step:"face",bf:{},visit:{smoke:lv?lv.visit.smoke:pr.smoke||0,htdx:pr.htdx,dmdx:pr.dmdx},result:null,onset:null,last:a.type,changed:["screen","bf","vals"]}}
  case"FACE":return{...n,bf:{...s.bf,face:a.v},last:a.type+" "+a.v,changed:["bf"]};
  case"SPEECH":return{...n,bf:{...s.bf,speech:a.v},last:a.type+" "+a.v,changed:["bf"]};
  case"NEXT":return{...n,step:a.v,last:a.type+" → "+a.v,changed:["screen"]};
  case"BEA":return{...n,bf:{...s.bf,[a.k]:a.v},last:a.type+" "+a.k+"="+(a.v?1:0),changed:["bf"]};
  case"BEFAST_DONE":{const r=SSIME.assess(pr,s.bf,{});
    if(r.befast.positive)return{...n,step:"black",result:r,onset:a.time,last:a.type+" → black",changed:["screen","bfRes","level","cv"]};
    return{...n,step:"sbp",last:a.type+" → ②",changed:["screen","bfRes"]}}
  case"VALUE":{if(!SSIME.validate(a.k,a.v))return{...n,error:a.k,last:a.type+" "+a.k+"="+a.v+" ✗",changed:["vals"]};
    const order=["sbp","dbp","fbs","yn"];return{...n,visit:{...s.visit,[a.k]:a.v},step:order[order.indexOf(a.k)+1],last:a.type+" "+a.k+"="+a.v,changed:["vals","screen"]}}
  case"ANSWER":return{...n,visit:{...s.visit,[a.k]:a.v},last:a.type+" "+a.k+"="+a.v,changed:["vals"]};
  case"SEE":{const p2={...pr,htdx:s.visit.htdx,dmdx:s.visit.dmdx};const r=SSIME.assess(p2,s.bf,s.visit);
    return{...n,step:"result",result:r,last:a.type,changed:["screen","level","reason","cv"]}}
  case"SAVE":{const lv=lastVisit(s);const rec={visit:s.step==="black"?(lv?{...lv.visit}:{}):{...s.visit},bf:s.bf,level:s.result.level};
    return{...n,hist:{...s.hist,[s.pid]:[...s.hist[s.pid],rec]},step:null,tab:"home",last:a.type,changed:["screen"]}}
  case"BACK":return{...n,step:a.v,last:a.type,changed:["screen"]};
  case"DONE":return{...n,done:{...s.done,[s.pid+a.k]:!s.done[s.pid+a.k]},last:a.type+" "+a.k};
  case"PICKS":return{...n,picks:{...s.picks,[s.pid]:{keys:a.keys,why:a.why,src:a.src}},last:a.type+" ("+a.src+")",changed:["missions"]};
  case"KAP_OPEN":return{...n,kapOpen:true,kapAns:{},last:a.type};
  case"KAP_ANS":return{...n,kapAns:{...s.kapAns,[a.k]:a.v},last:a.type+" "+a.k};
  case"KAP_SAVE":{const sc=SSIME.kapScore(s.kapAns),hasPre=PATIENTS[s.pid].kap||s.kapPre[s.pid];
    return hasPre?{...n,kap:{...s.kap,[s.pid]:sc},kapOpen:false,last:a.type}:{...n,kapPre:{...s.kapPre,[s.pid]:sc},kapOpen:false,last:a.type+" → pretest",changed:["kapPre"]}}
  default:return s}}

/* ============ PAGE SHELL ============ */
let S=initial();const $=id=>document.getElementById(id),V=$("view");
let typed="",chatMsgs={},chatHist={},sample=null,busy=false,scenario=0,wstep=0;
const t=k=>T[S.lang][k];
const fmt=(str,o)=>str.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
const cname=l=>COL[S.lang][l].n;
const per100=r=>r>0.3?t("more30"):Math.max(1,Math.round(r*100));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function dispatch(a){S=reduce(S,a);render()}
const pname=pid=>PATIENTS[pid||S.pid][S.lang];
const curX=()=>{const lv=lastVisit(S);return{...(profileOf(S)||DRAFT),...(lv?lv.visit:{})}};

function dots(l){return`<div class="dots" aria-label="${S.lang==="th"?"ระดับสี":"colour level"}">${HEX.map((c,i)=>`<i style="background:${c}" class="${i===l?"on":""}" title="${esc(cname(i))}"></i>`).join("")}</div>`}
function faceSVG(kind,hit){const droop=kind==="droop";
  return`<svg viewBox="-70 -70 140 140" width="110" height="110" aria-hidden="true">
  <circle r="60" fill="#F6E3D3" stroke="#8A6B57" stroke-width="2"/>
  <circle cx="-22" cy="-12" r="6" fill="#3B2A20"/><circle cx="22" cy="${droop?-6:-12}" r="6" fill="#3B2A20"/>
  ${droop?'<path d="M14 -10 Q22 -14 30 -6" stroke="#3B2A20" stroke-width="2.5" fill="none"/>':""}
  <path d="${droop?"M-24 22 Q-2 34 24 34":"M-24 22 Q0 38 24 22"}" stroke="#7A3B2E" stroke-width="4" fill="none" stroke-linecap="round"/>
  ${hit?'<circle cx="22" cy="18" r="24" fill="none" stroke="#C62828" stroke-width="3" stroke-dasharray="6 4"/>':""}</svg>`}

/* ---------- phone views ---------- */
function home(){const lv=lastVisit(S);
  if(!lv){const signed=!!profileOf(S);
    V.innerHTML=`<p class="muted">${t("hello")} ${esc(pname())} ${t("synthetic")}</p><div class="ball" style="background:#D5DBD9"></div>
    <div class="big">${t("noColour")}</div>${dots(-1)}<p class="center">${t("noColourSub")}</p>
    <button class="btn" id="measure">${signed?t("firstMeasure"):t("finishSignup")}</button><button class="btn warn" id="sos">${t("sos")}</button>`;
    $("measure").onclick=()=>dispatch({type:signed?"START":"ONBOARD"});$("sos").onclick=()=>dispatch({type:"START"});return}
  const l=lv.level,c=COL[S.lang][l],left=curMissions().filter(k=>!S.done[S.pid+k]).length;
  V.innerHTML=`<p class="muted">${t("hello")} ${esc(pname())} ${t("synthetic")}</p>
  <div class="ball" style="background:${HEX[l]}"></div>
  <div class="big">${S.lang==="th"?"สี":""}${c.n}<br><span class="small muted" style="font-weight:400">${c.m}</span></div>${dots(l)}
  <p class="center">${c.a}</p><div class="card"><b>${t("nextVisit")}</b><span>${c.next}</span></div>
  <button class="btn" id="measure">${t("measure")}</button>
  <button class="btn alt" id="goM">${t("mToday")} (${left})</button>
  <button class="btn warn" id="sos">${t("sos")}</button>`;
  $("measure").onclick=()=>dispatch({type:"START"});$("goM").onclick=()=>dispatch({type:"GO",v:"mission"});$("sos").onclick=()=>dispatch({type:"START"})}
function prog(i){return`<div class="prog">${[0,1,2,3,4,5].map(j=>`<i class="${j<=i?"on":""}"></i>`).join("")}</div><p class="small muted center">${t("step")} ${i+1} ${t("of")} 6</p>`}
function faceStep(){const f=S.bf.face,r=f&&SSIME.SIM.face[f];
  V.innerHTML=`${prog(0)}<h3>${t("s1")}</h3><p>${t("faceQ")}</p><span class="sim">${t("simTag")}</span>
  <div class="faces"><button data-v="normal" aria-pressed="${f==="normal"}">${faceSVG("normal",false)}${t("faceN")}</button><button data-v="droop" aria-pressed="${f==="droop"}">${faceSVG("droop",f==="droop")}${t("faceD")}</button></div>
  ${r?`<p class="airesult ${r.abnormal?"bad":""}">${r.abnormal?t("faceBad"):t("faceOk")} · ${t("conf")} ${Math.round((r.abnormal?r.score:1-r.score)*100)}%</p>`:""}
  <button class="btn" id="nx" ${f?"":"disabled"}>${t("next")}</button><button class="btn alt" id="bk">${t("cancel")}</button>`;
  V.querySelectorAll(".faces button").forEach(b=>b.onclick=()=>dispatch({type:"FACE",v:b.dataset.v}));
  $("nx").onclick=()=>dispatch({type:"NEXT",v:"speech"});$("bk").onclick=()=>dispatch({type:"GO",v:"home"})}
function speechStep(){const sp=S.bf.speech,r=sp&&SSIME.SIM.speech[sp];
  V.innerHTML=`${prog(1)}<h3>${t("s1")}</h3><p>${t("speechQ")}</p><p class="qq">${t("sentence")}</p><span class="sim">${t("simTag")}</span>
  <div class="faces"><button data-v="clear" aria-pressed="${sp==="clear"}">🎙 ${t("spC")}</button><button data-v="slurred" aria-pressed="${sp==="slurred"}">🎙 ${t("spS")}</button></div>
  ${r?`<p class="airesult ${r.abnormal?"bad":""}">${r.abnormal?t("spBad"):t("spOk")} · ${t("conf")} ${Math.round((r.abnormal?r.score:1-r.score)*100)}%</p>`:""}
  <button class="btn" id="nx" ${sp?"":"disabled"}>${t("next")}</button><button class="btn alt" id="bk">${t("back")}</button>`;
  V.querySelectorAll(".faces button").forEach(b=>b.onclick=()=>dispatch({type:"SPEECH",v:b.dataset.v}));
  $("nx").onclick=()=>dispatch({type:"NEXT",v:"bea"});$("bk").onclick=()=>dispatch({type:"BACK",v:"face"})}
const yn=(k,label,val,act)=>`<div class="row"><span>${label}</span><span class="seg" data-k="${k}" data-act="${act}"><button aria-pressed="${!!val}" data-v="1">${t("yes")}</button><button aria-pressed="${!val}" data-v="0">${t("no")}</button></span></div>`;
function wireYN(){V.querySelectorAll(".seg").forEach(sg=>sg.querySelectorAll("button").forEach(b=>b.onclick=()=>dispatch({type:sg.dataset.act,k:sg.dataset.k,v:+b.dataset.v})))}
function beaStep(){V.innerHTML=`${prog(2)}<h3>${t("s1")}</h3><p>${t("beaQ")}</p>
  ${yn("B",t("B"),S.bf.B,"BEA")}${yn("E",t("E"),S.bf.E,"BEA")}${yn("A",t("A"),S.bf.A,"BEA")}
  <p class="small muted">${t("Tn")}</p><button class="btn" id="nx">${t("next")}</button><button class="btn alt" id="bk">${t("back")}</button>`;
  wireYN();$("nx").onclick=()=>dispatch({type:"BEFAST_DONE",time:new Date().toLocaleTimeString(S.lang==="th"?"th-TH":"en-NZ",{hour:"2-digit",minute:"2-digit"})});$("bk").onclick=()=>dispatch({type:"BACK",v:"speech"})}
const NUM={sbp:{i:3,u:"mmhg"},dbp:{i:4,u:"mmhg"},fbs:{i:5,u:"mgdl"}};
function numStep(k){const d=NUM[k],[lo,hi]=({sbp:[70,260],dbp:[40,160],fbs:[40,500]})[k];
  V.innerHTML=`${prog(d.i)}<div class="qq">${t(k)}</div><div class="num" id="num" aria-live="polite">${typed||"&nbsp;"}</div>
  <p class="small muted center">${t(d.u)}</p><p class="err" id="err" role="alert">${S.error===k?`${t("range")} ${lo}–${hi} ${t("tryAgain")}`:""}</p>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button data-n="del">${t("del")}</button><button data-n="0">0</button><button data-n="ok" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)">${t("next")}</button></div>
  <button class="btn alt" id="bk">${t("back")}</button>`;
  V.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>{const n=b.dataset.n;
    if(n==="del")typed=typed.slice(0,-1);
    else if(n==="ok"){if(!typed){$("err").textContent=t("enterFirst");return}const v=+typed;typed="";dispatch({type:"VALUE",k,v});return}
    else if(typed.length<3)typed+=n;$("num").innerHTML=typed||"&nbsp;"});
  $("bk").onclick=()=>{typed="";dispatch({type:"BACK",v:k==="sbp"?"bea":k==="dbp"?"sbp":"dbp"})}}
function ynStep(){V.innerHTML=`<div class="qq">${t("ynQ")}</div>${yn("smoke",t("smoke"),S.visit.smoke,"ANSWER")}${yn("htdx",t("htdx"),S.visit.htdx,"ANSWER")}${yn("dmdx",t("dmdx"),S.visit.dmdx,"ANSWER")}
  <button class="btn" id="see">${t("see")}</button><button class="btn alt" id="bk">${t("back")}</button>`;
  wireYN();$("see").onclick=()=>dispatch({type:"SEE"});$("bk").onclick=()=>dispatch({type:"BACK",v:"fbs"})}
function reasonText(r){if(r.type==="befast")return`${t("found")} ${r.flags.join(", ")}`;const x=r.x;
  const main=r.type==="bp"?fmt(t("bpIs"),{s:x.sbp,d:x.dbp,c:cname(r.b)}):fmt(t("sugarIs"),{g:x.fbs,c:cname(r.g)});
  return main+(r.b!==r.g?` · ${t("otherBetter")}`:"")}
function cvCard(r){if(r.cv==null)return`<div class="card"><b>${t("cvH")}</b><span class="small muted">${r.cvNote==="stroke"?t("cvStroke"):t("cvAge")}</span></div>`;
  const x=r.reason.x,r2=SSIME.cvRisk({...x,sbp:Math.max(110,x.sbp-20),smoke:0});
  return`<div class="card"><b>${t("cvH")}</b><span>${fmt(t("cvTxt"),{n:per100(r.cv)})}</span><span class="small muted">${fmt(t("cvIf"),{s:x.smoke?t("quit"):"",n:per100(r2)})}</span>
  ${r.cvHigh?`<p class="alert small">${t("cvHigh")}</p><p class="small muted">${t("cvOver")}</p>`:""}</div>`}
function resultStep(){const r=S.result,l=r.level,c=COL[S.lang][l],lv=lastVisit(S),d=lv?lv.level-l:0;
  V.innerHTML=`<p class="small muted center">${t("today")}</p><div class="ball" style="background:${HEX[l]}"></div>
  <div class="big">${S.lang==="th"?"สี":""}${c.n}<br><span class="small muted" style="font-weight:400">${c.m}</span></div>${dots(l)}
  <p class="center ${d>0?"up":d<0?"down":""}">${!lv?t("baseline"):d>0?fmt(t("better"),{n:d}):d<0?fmt(t("worse"),{n:-d}):t("same")}</p>
  <div class="card"><b>${t("whyH")}</b><span class="small">${reasonText(r.reason)}</span></div>
  <div class="card"><b>${t("doH")}</b><span class="small">${c.a} · ${t("nextVisit")} ${c.next}</span></div>${cvCard(r)}

  else if(["VALUE","ANSWER","PVALUE","PANS","KAP_ANS"].includes(a))dispatch({type:a,k:b,v:c});else dispatch({type:a})}
function lab(){const L=S.lang;
  $("labH").textContent=t("labH");$("pickL").textContent=t("pickL");$("stateH").textContent=t("stateH");$("walkH").textContent=t("walkH");
  const pk=$("pick");pk.innerHTML="";Object.keys(PATIENTS).forEach(id=>{const b=document.createElement("button");b.className="chip";b.textContent=PATIENTS[id][L];b.setAttribute("aria-pressed",id===S.pid);b.onclick=()=>{chatMsgs={};chatHist={};typed="";wstep=0;dispatch({type:"RESET",pid:id})};pk.appendChild(b)});
  const st=t("st"),r=S.result,bfr=SSIME.befast(S.bf),v=S.visit,ch=S.changed;
  const bfTxt=["face","speech","B","E","A"].filter(k=>S.bf[k]!==undefined).map(k=>`${k}=${S.bf[k]===1?t("yes"):S.bf[k]===0?t("no"):S.bf[k]}`).join(" · ")||t("none");
  const vals=["sbp","dbp","fbs"].filter(k=>v[k]!=null).map(k=>`${k.toUpperCase()} ${v[k]}`).concat(v.smoke!=null?[`smoke ${v.smoke?t("yes"):t("no")}`]:[],v.htdx!=null?[`HT dx ${v.htdx?t("yes"):t("no")}`]:[],v.dmdx!=null?[`DM dx ${v.dmdx?t("yes"):t("no")}`]:[]).join(" · ")||t("none");
  const pf=profileOf(S),src=pf||(S.step&&["age","height","waist","pyn"].includes(S.step)?S.draft:null);
  const pfTxt=src?`${src.age??"?"} ${t("yrs")} · ${src.sex?t("male"):t("female")} · ${src.height??"?"}/${src.waist??"?"} ${t("cm")} · HT ${src.htdx?t("yes"):t("no")} · DM ${src.dmdx?t("yes"):t("no")}${pf?"":" (draft)"}`:t("none");
  const kp=PATIENTS[S.pid].kap?PATIENTS[S.pid].kap.pre:S.kapPre[S.pid];
  const rows=[["patient",esc(pname())],["profile",pfTxt],["kapPre",kp?`K ${kp.K} · A ${kp.A} · P ${kp.P}`:t("none")],["screen",`${S.tab}${S.step?" › "+S.step:""}`],["bf",esc(bfTxt)],["bfRes",S.step&&S.step!=="face"&&S.step!=="speech"&&S.step!=="bea"||S.result?(bfr.positive?`${t("positive")} (${bfr.flags.join(", ")})`:t("negative")):t("notyet")],
    ["vals",esc(vals)],["level",r?`${esc(cname(r.level))}${r.level===6?"":""}`:t("notyet")],["reason",r?esc(reasonText(r.reason)):t("notyet")],
    ["cv",r?(r.cv==null?(r.cvNote==="stroke"?t("cvStroke"):t("cvAge")):`${per100(r.cv)}/100${r.cvHigh?" · ≥20% ⚠":""}`):t("notyet")],
    ["missions",curMissions().map(k=>MIS[L][k]).join(" · ")],["last",esc(S.last)+(S.error?" · ✗ "+(L==="th"?"ค่าผิดช่วง ถูกปฏิเสธ":"out of range, refused"):"")]];
  $("state").innerHTML=rows.map(([k,val])=>`<dt>${st[k]}</dt><dd class="${ch.includes(k)?"changed":""}">${val}</dd>`).join("");
  const wt=$("wtabs");wt.innerHTML="";W.forEach((w,i)=>{const b=document.createElement("button");b.className="chip";b.setAttribute("role","tab");b.setAttribute("aria-selected",i===scenario);b.setAttribute("aria-pressed",i===scenario);b.textContent=w.name[L];
    b.onclick=()=>{scenario=i;wstep=0;chatMsgs={};chatHist={};typed="";dispatch({type:"RESET",pid:w.pid})};wt.appendChild(b)});
  const w=W[scenario];$("wdesc").textContent=w.desc[L];
  const ws=$("wsteps");ws.innerHTML="";w.steps.forEach((s,i)=>{const b=document.createElement("button");b.textContent=`${i+1}. ${stepLabel(s)}`;b.className=i<wstep?"did":i===wstep?"next":"";b.disabled=i!==wstep;
    b.onclick=()=>{if(i===0&&S.pid!==w.pid)S=initial(w.pid,S.lang);wstep=i+1;runStep(s)};ws.appendChild(b)})}

/* ---------- committee panel ---------- */
const TEST={tp:17,fn:3,fp:13,tn:67};
function jury(){const L=S.lang,m=t("map");$("juryH").textContent=t("juryH");
  $("map").innerHTML=m.map(([h,d,b])=>`<div class="card"><b>${h}</b><span class="small">${d}</span><span class="badge ${b==="AI"?"":"rule"}">${b}</span></div>`).join("");
  $("testH").textContent=t("testH");
  $("cm").innerHTML=`<tr><th></th><th>${t("actual")}: ${t("strokeY")}</th><th>${t("actual")}: ${t("strokeN")}</th></tr><tr><td>${t("pred")}: ${t("strokeY")}</td><td>${TEST.tp}</td><td>${TEST.fp}</td></tr><tr><td>${t("pred")}: ${t("strokeN")}</td><td>${TEST.fn}</td><td>${TEST.tn}</td></tr>`;
  const prec=TEST.tp/(TEST.tp+TEST.fp),sens=TEST.tp/(TEST.tp+TEST.fn),spec=TEST.tn/(TEST.tn+TEST.fp);
  $("kpis").innerHTML=`<div class="card"><b>${t("prec")}</b><span class="kpi ${prec>=.5?"ok":"no"}">${Math.round(prec*100)}%</span><span class="small">${t("target")} ≥ 50% · ${prec>=.5?t("met"):t("notMet")}</span></div>
  <div class="card"><b>${t("sens")}</b><span class="kpi">${Math.round(sens*100)}%</span></div><div class="card"><b>${t("spec")}</b><span class="kpi">${Math.round(spec*100)}%</span></div>`;
  $("prevH").textContent=t("prevH");$("prevP").textContent=t("prevP");
  const upd=()=>{const p=+$("prev").value/100,q=SSIME.precisionAt(sens,spec,p);$("prevOut").textContent=fmt(t("prevOut"),{p:Math.round(p*100),q:Math.round(q*100),ok:q>=.5?t("met"):t("notMet")})};
  $("prev").oninput=upd;upd();$("simNote").textContent=t("simNote")}

/* ---------- render ---------- */
function render(){document.documentElement.lang=S.lang;
  $("protoTag").textContent=t("proto");$("title").textContent=t("title");$("question").textContent=t("question");$("appName").textContent=t("app");
  $("who").textContent=pname();$("foot").textContent=t("foot");
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang));
  const tabsK=["home","mission","chat","history"],ic=["●","✓","?","↻"];
  $("tabs").innerHTML=tabsK.map((k,i)=>`<button data-t="${k}" aria-current="${S.tab===k&&!S.step}"><span class="ic">${ic[i]}</span>${t("tabs")[i]}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{typed="";dispatch({type:"GO",v:b.dataset.t})});
  V.classList.remove("chatv");$("chatInput").hidden=true;
  if(S.step){({consent:consentStep,age:()=>pnumStep("age"),height:()=>pnumStep("height"),waist:()=>pnumStep("waist"),pyn:pynStep,kappre:kapPreStep,face:faceStep,speech:speechStep,bea:beaStep,sbp:()=>numStep("sbp"),dbp:()=>numStep("dbp"),fbs:()=>numStep("fbs"),yn:ynStep,result:resultStep,black:blackStep})[S.step]()}
  else({home,mission,chat,history})[S.tab]();
  if(S.tab!=="chat")V.scrollTop=0;
  lab();jury()}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>dispatch({type:"LANG",v:b.dataset.lang}));
render();
(async()=>{try{if(window.claude&&claude.use){const s=await claude.use("sample");if(s){sample=s;if(S.tab==="chat")render()}}}catch(e){}})();
</script>
